# Supabase 무료 플랜은 7일간 DB 요청이 없으면 프로젝트를 일시정지해요.
# 이 워크플로가 3일마다 공개 함수(get_portfolio)를 한 번 불러서 DB를 깨워 둡니다.
# portfolio-tech / portfolio-creative 둘 다 같은 DB를 쓰므로 여기 하나면 충분해요.
#
# - 응답 내용은 로그에 남기지 않고 HTTP 상태 코드만 출력해요 (개인정보 보호).
# - 아래 키는 db.js 에 이미 있는 '방문자용 공개 키'와 같은 것이에요.
# - 참고: 공개 레포에서 60일 동안 커밋이 없으면 GitHub가 예약 워크플로를 자동으로 꺼요.
#   그럴 땐 Actions 탭에서 다시 Enable 해 주세요.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 */3 * *" # 3일마다 03:17 UTC (한국 12:17)
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://yuzardhmvsexygmknfcc.supabase.co
          SUPABASE_KEY: sb_publishable_-CKlqet6TjLm-jlqJ003DQ_y95Rjx99
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_portfolio" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_track":"tech","p_code":null}')
          echo "Supabase responded with HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::DB 응답 이상 (HTTP $status). 프로젝트가 일시정지됐는지 Supabase 대시보드를 확인하세요."
            exit 1
          fi
